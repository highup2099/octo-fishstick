[project]
name = "cryptobroker-api"
version = "0.4.0"
requires-python = ">=3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.30,<1",
  "alembic>=1.16,<2",
  "pydantic-settings>=2.10,<3",
  "redis>=6,<7",
  "httpx>=0.28,<1",
  "PyJWT>=2.10,<3",
]
[project.optional-dependencies]
test = ["pytest>=8,<9", "pytest-asyncio>=1,<2"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
